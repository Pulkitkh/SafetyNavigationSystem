<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SafeNav</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f5fa; --surface: #fff; --ink: #15131f; --ink2: #4b4862; --line: #e3e1ee; --brand: #5b3fd6; --sos: #e11d48; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0b14; --surface: #16151f; --ink: #f1f0f7; --ink2: #c3c1d6; --line: #2b2a3a; --brand: #6a52e3; } }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
      main { max-width: 28rem; margin: 0 auto; padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem 2rem; }
      h1 { margin: 0.5rem 0 0.25rem; font-size: 1.6rem; }
      p { margin: 0; color: var(--ink2); }
      .btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; min-height: 3.25rem; margin-top: 0.75rem; padding: 0.85rem 1rem; border: 0; border-radius: 1rem; font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
      .sos { background: var(--sos); color: #fff; font-size: 1.35rem; min-height: 4.5rem; }
      .call { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); justify-content: space-between; font-weight: 700; }
      .call b { font-size: 1.4rem; }
      .retry { background: var(--brand); color: #fff; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach SafeNav</h1>
      <p>No signal, or the server is starting up. SOS by SMS and emergency calls still work.</p>
      <!-- Handled by the Android app, which asks for confirmation and texts contacts from the SIM. -->
      <a class="btn sos" href="safenavsos://send">Send SOS to my contacts</a>
      <a class="btn call" href="tel:112"><b>112</b> Police · Fire · Ambulance</a>
      <a class="btn call" href="tel:1091"><b>1091</b> Women helpline (police)</a>
      <a class="btn call" href="tel:181"><b>181</b> Women helpline</a>
      <a class="btn call" href="tel:108"><b>108</b> Ambulance</a>
      <button class="btn retry" type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
    </main>
  </body>
</html>
