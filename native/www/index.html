<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SafeNav</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      main { max-width: 28rem; margin: 0 auto; padding: 2rem 1.25rem; }
      a.call { display: block; margin-top: 1rem; padding: 1rem; border-radius: 1rem; background: #dc2626; color: #fff; font-size: 1.5rem; font-weight: 700; text-decoration: none; }
      a.num { display: block; margin-top: .5rem; padding: .75rem 1rem; border-radius: .75rem; background: #fff; color: #0f172a; text-decoration: none; box-shadow: 0 1px 2px #0002; }
      button { margin-top: 1.5rem; width: 100%; padding: .75rem; border: 0; border-radius: .75rem; background: #1d4ed8; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>SafeNav is offline</h1>
      <p>Emergency calls work without mobile data.</p>
      <a class="call" href="tel:112">Call 112 — Police, Fire, Ambulance</a>
      <a class="num" href="tel:1091"><b>1091</b> Women helpline (police)</a>
      <a class="num" href="tel:181"><b>181</b> Women helpline</a>
      <a class="num" href="tel:108"><b>108</b> Ambulance</a>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
