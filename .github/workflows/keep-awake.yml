# Render's free plan puts the server to sleep after 15 idle minutes, and waking
# it takes up to a minute: too slow for an SOS. This pings it every 10 minutes
# so it stays ready. (A paid Render plan doesn't sleep and makes this unneeded.)
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" "${{ vars.APP_URL || 'https://safenav-0ywr.onrender.com' }}/api/auth/me"
